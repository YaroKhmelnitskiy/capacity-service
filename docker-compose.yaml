x-app-env: &app-env
  JWT_SECRET: local-development-secret-change-me-0123456789
  FX_RATES: USD=1,EUR=1.08,GBP=1.27,JPY=0.0067
  KAFKA_TOPIC: treasury.capacity

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: capacity-service
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U user -d capacity-service']
      interval: 2s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - '127.0.0.1:9094:9094'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'kafka:9092', '--create', '--if-not-exists', '--topic', 'treasury.capacity', '--partitions', '3', '--replication-factor', '1']
    restart: 'no'

  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 3000
      DATABASE_URL: postgres://user:password@db:5432/capacity-service
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: info
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health/readiness']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
